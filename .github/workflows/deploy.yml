name: Deploy

# One Worker serves both the web app and the API, so any change to either
# ships in one deploy. Lint and tests gate it; a red run deploys nothing.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json

      - name: Install
        run: |
          npm ci --prefix frontend
          npm ci --prefix worker

      - name: Frontend lint and tests
        working-directory: frontend
        run: |
          npm run lint
          npm run test:run

      - name: Worker lint and tests
        working-directory: worker
        run: |
          npm run lint
          npx tsc --noEmit
          npm run test:coverage

      # Builds the frontend, applies D1 migrations, then deploys the Worker.
      - name: Deploy
        working-directory: worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
