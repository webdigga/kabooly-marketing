name = "kabooly-marketing"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

# One Worker serves both the web app and the API, so the session cookie is
# first-party and no CORS is needed. /api/* reaches the Worker; every other
# path is a static file from the Vite build, with unknown paths falling back
# to index.html for client-side routes.
routes = [{ pattern = "marketing.kabooly.com", custom_domain = true }]

[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "kabooly-marketing"
database_id = "3b05463a-de11-4601-8ebd-8efda67f5a31"
migrations_dir = "migrations"

# Generated advert images and uploaded logos.
[[r2_buckets]]
binding = "FILES"
bucket_name = "kabooly-marketing-images"

# Cloudflare Email Sending: verification and password reset codes.
[[send_email]]
name = "EMAIL"

# Cloudflare Images: crops Gemini output to each platform's exact size.
[images]
binding = "IMAGES"

# One limiter per account: daily image cap, per-minute rate and the
# one-generation-in-flight lock, all in a single serialised instance.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "GenerationLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GenerationLimiter"]

# Keeps Worker logs in the dashboard (Workers > kabooly-marketing > Logs).
[observability]
enabled = true

[vars]
# The canonical auth origin. OAuth callbacks and session cookies hang off it.
BETTER_AUTH_URL = "https://marketing.kabooly.com"
GEMINI_IMAGE_MODEL = "gemini-3-pro-image"
GEMINI_VIDEO_MODEL = "gemini-omni-1.1-flash"
# Sender for verification and reset codes. marketing.kabooly.com is its own
# sending domain in Cloudflare Email Sending, apart from the CRM's Resend
# domain (mail.kabooly.com) and the IONOS mailboxes on kabooly.com.
EMAIL_FROM = "noreply@marketing.kabooly.com"
# The founder's own login: this account works without a subscription.
FOUNDER_LOGIN_EMAIL = "webdigga42@gmail.com"
# Secrets (wrangler secret put): BETTER_AUTH_SECRET, GOOGLE_CLIENT_ID,
# GOOGLE_CLIENT_SECRET, ANTHROPIC_API_KEY, GEMINI_API_KEY, INTERNAL_API_SECRET,
# STRIPE_WEBHOOK_SECRET
